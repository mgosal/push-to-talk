# Push-to-Talk — voice typing for macOS  

# Example configuration for push-to-talk.
# Copy to ~/.config/push-to-talk/config.toml

[api]
# OpenAI-compatible chat completions endpoint.
# Default: OpenRouter (vendor-neutral).
# The setup UI can switch between these supported patterns:
#   OpenRouter: "https://openrouter.ai/api/v1/chat/completions"
#   OpenAI:     "https://api.openai.com/v1/chat/completions"
endpoint = "https://openrouter.ai/api/v1/chat/completions"

# Model identifier. Must support audio input.
#   OpenRouter: "openai/gpt-4o-transcribe"
#   OpenAI:     "gpt-4o-transcribe"
model = "openai/gpt-4o-transcribe"

# API key. Three options (checked in order):
#   1. Inline:       key = "sk-or-..."
#   2. File:         key_file = "api-key"        (relative to config dir; setup UI writes this)
#   3. Environment:  OPENROUTER_API_KEY or OPENAI_API_KEY
# key = ""
key_file = "api-key"

# Retry on 5xx / connection errors.
max_retries = 3
retry_backoff = [1, 3, 5]

[audio]
# Native macOS AVFAudio recording. No external recorder binary is required.
# Minimum recording duration (seconds). Shorter = discard.
min_duration_s = 0.4

[transcription]
# Which engine transcribes recordings:
#   "api"   — OpenAI-compatible HTTP API (default). Needs a key and a network.
#             Best on domain vocabulary, because a speaker profile primes it.
#   "local" — Parakeet running on-device via parakeet-mlx. No key, no network,
#             no audio leaves the machine. Falls back to "api" if the local
#             model can't be started (see [transcription.local]).
backend = "api"

# Speaker profile for transcription priming.
# Generated by the "Set Up Speaker Profile" menu item, or create manually.
# Describes the speaker's accent, vocabulary, domain terms, pronunciation patterns.
# If omitted, the app automatically uses ~/.config/push-to-talk/speaker-profile.md
# when that generated profile exists.
# speaker_profile = "~/.config/push-to-talk/speaker-profile.md"

# Hallucination guard: max words-per-second threshold.
max_wps = 5.0

# Directory for saved transcript markdown files (with YAML frontmatter).
# Each transcription is saved as a .md file alongside the DB record.
# transcripts_dir = "~/dictation/transcripts"

# Settings for backend = "local". Ignored when backend = "api".
#
# One-time setup (Apple Silicon):
#   brew install ffmpeg                 # parakeet-mlx decodes audio through it
#   uv tool install parakeet-mlx        # or: pip install parakeet-mlx
#
[transcription.local]
# Launcher for the sidecar process. The sidecar script and the model id are
# appended, so this can be a bare interpreter or a wrapper that supplies the
# dependency:
#   command = ["python3"]
#   command = ["uv", "run", "--no-project", "--with", "parakeet-mlx", "python"]
#   command = ["/Users/you/.local/share/uv/tools/parakeet-mlx/bin/python"]
# Whatever you point this at must have parakeet-mlx importable.
#
# An app launched from Finder inherits launchd's minimal PATH, so the sidecar
# is given /opt/homebrew/bin, /usr/local/bin and ~/.local/bin on top of it —
# enough to find uv, python3 and the ffmpeg that parakeet-mlx decodes through.
# Use an absolute path here if your tools live somewhere else.
command = ["python3"]

# Hugging Face model id. The default benchmarked better than gpt-4o-transcribe
# on both WER and CER, and being a transducer it cannot hallucinate fluent
# text from silence — it returns nothing instead.
model = "mlx-community/parakeet-tdt-0.6b-v3"

# Seconds to wait for the model to load. The first run downloads ~2.5 GB of
# weights from Hugging Face; later runs load from the local cache in seconds.
ready_timeout_s = 600.0

# Seconds to wait for a single transcription.
request_timeout_s = 120.0

# Load the model at app launch instead of on the first dictation, so the first
# recording of the session isn't the one that waits for it.
warm_up = true

[storage]
# SQLite database for history & corrections.
# Default: ~/.config/push-to-talk/history.db
# db = "~/my-project/ptt-history.db"

# Temporary native WAV recording directory. Default: system temp.
# audio_dir = "/tmp/ptt"

# PID file for detecting running instance. Default: /tmp/ptt.pid
pid_file = "/tmp/ptt.pid"

# Unix socket for IPC (--toggle, --status). Default: /tmp/ptt.sock
socket_path = "/tmp/ptt.sock"

[ui]
# Show macOS notifications for transcription results and profile events.
# Set to false to suppress all notifications.
notifications = true
